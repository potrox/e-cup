[project]
name = "ecup-matching"
version = "0.1.0"
description = "E-CUP 2026 product matching solution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3,<2",
    "huggingface-hub>=1.21,<2",
    "lightgbm>=4.6,<5",
    "numpy>=2.2,<3",
    "orjson>=3.11,<4",
    "pandas>=2.2,<3",
    "polars>=1.30,<2",
    "psutil>=7.1,<8",
    "pyarrow>=20,<24",
    "rapidfuzz>=3.14,<4",
    "scipy>=1.16,<2",
    "scikit-learn>=1.7,<2",
    "torch>=2.9,<3",
    "transformers>=5.12.1,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecup_matching"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", "artifacts", "data_derived"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
